<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e2eff8">
  <link rel="icon" href="data:,">
  <title>ykmalzer06 / 日麻役满分析器06</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="日麻役满分析器06首页">
      <span class="brand-mark">06</span>
      <span><strong>日麻役满分析器06</strong><small>ykmalzer06 · 雀魂规则</small></span>
    </a>
    <div class="top-actions">
      <label class="rule-select"><span>规则</span><select id="player-count"><option value="4">四人麻将</option><option value="3">三人麻将</option></select></label>
      <label class="mode-toggle"><input id="yakuman-mode" type="checkbox" checked><span class="toggle-track"></span><span>役满分析</span></label>
    </div>
  </header>

  <main class="layout">
    <section class="workspace">
      <div class="section-head">
        <div><p class="eyebrow">HAND ANALYSIS</p><h1>牌姿分析</h1></div>
        <div class="head-actions">
          <button class="icon-button" id="copy-state" type="button" title="复制手牌、副露与宝牌信息" aria-label="复制手牌、副露与宝牌信息"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button>
          <button class="icon-button clear-button" id="clear-hand" type="button" title="清空手牌" aria-label="清空手牌"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg></button>
        </div>
      </div>

      <div class="tiles-heading"><span>手牌</span><span id="tile-count" class="count-label">0 / 14 张</span></div>
      <div id="hand-tiles" class="hand-tiles" aria-live="polite"></div>

      <div class="tile-controls">
        <div class="control-title"><span>添加牌</span><span class="helper-text">点击牌面加入手牌，点击手牌移除</span></div>
        <div id="tile-palette" class="tile-palette" aria-label="选择麻将牌"></div>
      </div>

      <div class="settings-grid">
        <section class="setting-block">
          <div class="control-title"><span>副露</span><span id="meld-count" class="count-label">0 组</span></div>
          <div class="meld-form">
            <label><span>副露类型</span><select id="meld-kind" aria-label="副露类型"><option value="chi">吃（选择顺子起始牌）</option><option value="pon">碰</option><option value="kan">明杠</option><option value="ankan">暗杠</option></select></label>
          </div>
          <div id="meld-picker" class="meld-picker" aria-label="点击牌面添加副露"></div>
          <div id="meld-list" class="meld-list"></div>
        </section>
        <section class="setting-block">
          <div class="control-title"><span>宝牌</span><span class="helper-text">每种最多四张，总计最多十张</span></div>
          <div id="dora-list" class="dora-list"></div>
          <div class="dora-picker" id="dora-picker" aria-label="点击牌面加入宝牌"></div>
        </section>
      </div>

      <div class="settings-grid secondary-settings">
        <section class="setting-block">
          <div class="control-title"><span>场况</span></div>
          <div class="select-row">
            <label><span>场风</span><select id="round-wind"><option value="27">东</option><option value="28">南</option><option value="29">西</option></select></label>
            <label><span>自风</span><select id="seat-wind"><option value="27">东</option><option value="28">南</option><option value="29">西</option><option value="30">北</option></select></label>
          </div>
        </section>
        <section class="setting-block sanma-only" id="kita-setting">
          <div class="control-title"><span>拔北</span><span class="helper-text">每张计 1 番宝牌</span></div>
          <div class="stepper"><button id="kita-dec" type="button" aria-label="减少拔北">−</button><output id="kita-count">0</output><button id="kita-inc" type="button" aria-label="增加拔北">+</button></div>
        </section>
      </div>

      <div class="analyze-row">
        <div id="input-status" class="input-status">选择手牌以开始分析</div>
      </div>
    </section>

    <aside class="results" aria-live="polite">
      <div class="section-head result-heading">
        <div><p class="eyebrow">RESULT</p><h2>分析结果</h2></div>
        <span id="result-state" class="result-state">待分析</span>
      </div>
      <div id="result-content" class="result-content">
        <div class="empty-result"><span class="empty-symbol">?</span><strong>等待牌姿</strong><p>输入 13 或 14 张有效牌后进行分析</p></div>
      </div>
      <div class="result-footnote" id="result-note">雀魂常用规则 · 赤宝牌 · 三麻拔北</div>
    </aside>
  </main>

  <footer class="app-footer"><span>ykmalzer06 / 日麻役满分析器06</span><a href="assets/mahjong/ATTRIBUTION.txt">牌图素材来源</a></footer>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
